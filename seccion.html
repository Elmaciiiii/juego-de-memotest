    <style>
        body, html {
            font-family: 'OpenDyslexic', Arial, sans-serif;
        }
        .controls-panel {
            background: linear-gradient(145deg, #ffffff, #f8fbff);
            border-radius: 20px;
            padding: 15px;
            border: 2px solid #e3f2fd;
            box-shadow: 0 10px 30px rgba(33, 150, 243, 0.1);
            overflow-y: auto;
            max-width: 350px;
            margin: 0 auto;
        }
        @media (min-width: 992px) {
            .controls-panel {
                padding: 25px;
                max-width: 350px;
            }
        }
        .control-group {
            margin-bottom: 25px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(33, 150, 243, 0.08);
            border: 1px solid #e3f2fd;
            transition: all 0.3s ease;
        }
        .control-group:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.15);
        }
        .control-group h3 {
            color: #1565c0;
            margin-bottom: 15px;
            font-size: 1.2rem;
            border-bottom: 3px solid #2196f3;
            padding-bottom: 8px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1976d2;
        }
        .control-group input[type="range"], .control-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e3f2fd;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #fafbfc;
        }
        .control-group input[type="range"] {
            padding: 0;
            margin-bottom: 8px;
        }
        .control-group input:focus, .control-group select:focus {
            outline: none;
            border-color: #2196f3;
            box-shadow: 0 0 0 4px rgba(33, 150, 243, 0.1);
            background: white;
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        @media (min-width: 576px) {
            .color-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px;
            }
        }
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        .color-option.selected {
            border-color: #2196f3;
            box-shadow: 0 0 0 4px #90caf9;
        }
        .btn {
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(33, 150, 243, 0.3);
            width: 100%;
            margin-bottom: 10px;
            position: relative;
            overflow: hidden;
            font-weight: 600;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(33, 150, 243, 0.4);
            background: linear-gradient(135deg, #1976d2 0%, #0d47a1 100%);
        }
        .btn:disabled {
            background: linear-gradient(135deg, #b0bec5 0%, #90a4ae 100%);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        /* MODO OSCURO para el menú de personalización */
        body.dark-mode .controls-panel,
        html.dark-mode .controls-panel {
            background: #23272f;
            border-color: #222b38;
            box-shadow: 0 10px 30px rgba(33, 150, 243, 0.05);
        }
        body.dark-mode .control-group,

            box-shadow: 0 5px 20px rgba(33, 150, 243, 0.04);

        body.dark-mode .control-group label,

            color: #90caf9;
        }
        body.dark-mode .control-group input[type="range"],
        body.dark-mode .control-group select,
        html.dark-mode .control-group input[type="range"],
        html.dark-mode .control-group select {

<script>
// ========== FUNCIONES DE ESTILOS PERSONALIZADOS ==========
function applyStyles() {
    const fontSize = document.getElementById('fontSizeSlider').value;
    const fontFamily = document.getElementById('fontFamily').value;
    const textColor = document.querySelector('#textColorGrid .color-option.selected')?.dataset.color || '#000000';
    const bgColor = document.querySelector('#bgColorGrid .color-option.selected')?.dataset.color || '#ffffff';
    const content = document.getElementById('content');
    if (!content || content.innerHTML.trim() === '') {
        showCustomAlert('No hay contenido para aplicar los estilos. Primero carga un texto.', 'Aviso');
        return;
    }
    content.style.fontSize = fontSize + 'px';
    content.style.fontFamily = fontFamily;
    content.style.color = textColor;
    content.style.backgroundColor = bgColor;
    if (fontFamily.includes('OpenDyslexic')) {
        content.style.letterSpacing = '0.12em';
        content.style.lineHeight = '1.6';
    } else {
        content.style.letterSpacing = 'normal';
        content.style.lineHeight = 'normal';
    }
    showCustomAlert('¡Estilos aplicados correctamente!', 'Éxito');
    updatePreview();
}

function updatePreview() {
    const fontSize = document.getElementById('fontSizeSlider').value;
    const fontFamily = document.getElementById('fontFamily').value;
    const textColor = document.querySelector('#textColorGrid .color-option.selected')?.dataset.color || '#000000';
    const bgColor = document.querySelector('#bgColorGrid .color-option.selected')?.dataset.color || '#ffffff';
    const preview = document.getElementById('preview');
    if (!preview) return;
    preview.style.fontSize = fontSize + 'px';
    preview.style.fontFamily = fontFamily;
    preview.style.color = textColor;
    preview.style.backgroundColor = bgColor;
    if (fontFamily.includes('OpenDyslexic')) {
        preview.style.letterSpacing = '0.12em';
        preview.style.lineHeight = '1.6';
    } else {
        preview.style.letterSpacing = 'normal';
        preview.style.lineHeight = 'normal';
    }
}

function resetStyles() {
    document.getElementById('fontSizeSlider').value = 18;
    document.getElementById('fontSizeValue').textContent = '18px';
    document.getElementById('fontFamily').value = 'OpenDyslexic, sans-serif';
    document.querySelectorAll('#textColorGrid .color-option').forEach(opt => opt.classList.remove('selected'));
    document.querySelector('#textColorGrid .color-option[data-color="#000000"]').classList.add('selected');
    document.querySelectorAll('#bgColorGrid .color-option').forEach(opt => opt.classList.remove('selected'));
    document.querySelector('#bgColorGrid .color-option[data-color="#ffffff"]').classList.add('selected');
    applyStyles();
    updatePreview();
}

function togglePreview() {
    const container = document.getElementById('previewContainer');
    if (!container) return;
    if (container.style.display === 'none' || container.style.display === '') {
        container.style.display = 'block';
        updatePreview();
    } else {
        container.style.display = 'none';
    }
}
// ========== FIN FUNCIONES DE ESTILOS PERSONALIZADOS ==========

// Interacción para color-grid (igual que editor de PDF)
function setupColorSelector(gridId, property) {
    const grid = document.getElementById(gridId);
    if (!grid) return;
    grid.querySelectorAll('.color-option').forEach(option => {
        option.addEventListener('click', function() {
            grid.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
            this.classList.add('selected');
            // Aplica el color seleccionado
            if (property === 'color') {
                document.documentElement.style.setProperty('--custom-text-color', this.dataset.color);
            } else if (property === 'background') {
                document.documentElement.style.setProperty('--custom-bg-color', this.dataset.color);
            }
        });
    });
}
// Slider de tamaño de texto
const fontSizeSlider = document.getElementById('fontSizeSlider');
const fontSizeValue = document.getElementById('fontSizeValue');
if(fontSizeSlider && fontSizeValue){
    fontSizeSlider.addEventListener('input', function() {
        fontSizeValue.textContent = this.value + 'px';
        updatePreview();
    });
}
// Inicializar color pickers
setupColorSelector('textColorGrid', 'color');
setupColorSelector('bgColorGrid', 'background');

// Actualizar preview en tiempo real al cambiar selectores
const fontFamily = document.getElementById('fontFamily');
if(fontFamily){
    fontFamily.addEventListener('change', updatePreview);
}
['textColorGrid','bgColorGrid'].forEach(gridId => {
    const grid = document.getElementById(gridId);
    if(grid){
        grid.querySelectorAll('.color-option').forEach(opt => {
            opt.addEventListener('click', updatePreview);
        });
    }
});

// ========== TOUR CON INTRO.JS ==========

// Función para inicializar el tour
function initTour() {
    const intro = introJs();
    
    // Configurar los pasos del tour
    intro.setOptions({
        // Textos en español
        nextLabel: 'Siguiente →',
        prevLabel: '← Anterior',
        skipLabel: 'Saltar',
        doneLabel: 'Finalizar',
        
        // Configuración de estilo simple
        tooltipClass: 'customTooltip',
        highlightClass: 'customHighlight',
        
        // Configuración de comportamiento
        showStepNumbers: true,
        showBullets: false,
        showProgress: true,
        exitOnEsc: true,
        exitOnOverlayClick: false,
        disableInteraction: false,
        
        // Pasos del tour
        steps: [
            {
                element: 'header h1',
                intro: "¡Bienvenido a OpenDislex! 👋<br>Esta herramienta te ayuda a hacer más accesible cualquier contenido web para personas con dislexia.",
                position: 'bottom'
            },
            {
                element: '#url',
                intro: "Aquí puedes ingresar cualquier enlace web que quieras convertir en un formato más accesible. 🔗",
                position: 'bottom'
            },
            {
                element: '#pasteButton',
                intro: "Usa este botón para pegar rápidamente un enlace desde tu portapapeles. 📋",
                position: 'top'
            },
            {
                element: 'button[onclick="fetchContent()"]',
                intro: "Haz clic aquí para cargar y procesar el contenido del enlace. ⚡",
                position: 'top'
            },
            {
                element: '#customMenuToggle',
                intro: "Este menú te permite personalizar completamente la apariencia del texto: tamaño, colores de letra y fondo y la fuente. 🎨",
                position: 'bottom'
            },
            {
                element: '#darkModeToggle',
                intro: "Activa el modo oscuro para reducir el cansancio visual durante la lectura nocturna. 🌙",
                position: 'left'
            },
            {
                element: '#colorblindMode',
                intro: "Selecciona un modo especial si tienes daltonismo para mejorar la visualización de colores. 👁️",
                position: 'left'
            },
            {
                element: '#content',
                intro: "Aquí aparecerá el contenido procesado con formato accesible. También incluye controles de lectura en voz alta. 📖",
                position: 'top'
            }
        ]
    });
    
    return intro;
}

// Función para iniciar el tour
function startTour() {
    const intro = initTour();
    
    // Eventos del tour
    intro.onchange(function(targetElement) {
        // Si estamos en el paso del menú personalizado, ábrelo temporalmente
        if (targetElement.id === 'customMenuToggle') {
            const sidebar = document.getElementById('sidebar');
            if (sidebar && !sidebar.classList.contains('open')) {
                sidebar.classList.add('open');
                document.getElementById('sidebarOverlay').style.display = 'block';
            }
        }
    });
    
    intro.onexit(function() {
        // Cerrar el menú si está abierto al salir del tour
        const sidebar = document.getElementById('sidebar');
        if (sidebar && sidebar.classList.contains('open')) {
            sidebar.classList.remove('open');
            document.getElementById('sidebarOverlay').style.display = 'none';
        }
    });
    
    intro.oncomplete(function() {
        showCustomAlert('¡Tour completado! Ya puedes comenzar a usar OpenDislex. 🎉', 'Éxito');
    });
    
    // Iniciar el tour
    intro.start();
}

// Función para mostrar el tour automáticamente en la primera visita
function checkFirstVisit() {
    const hasVisited = localStorage.getItem('openDislex_hasVisited');
    if (!hasVisited) {
        // Esperar un poco para que la página se cargue completamente
        setTimeout(() => {
            startTour();
            localStorage.setItem('openDislex_hasVisited', 'true');
        }, 1000);
    }
}

// Función para agregar botón de ayuda
function addHelpButton() {
    // Crear botón de ayuda flotante
    const helpButton = document.createElement('button');
    helpButton.innerHTML = '❓';
    helpButton.className = 'help-button';
    helpButton.title = 'Iniciar tour de ayuda';
    helpButton.onclick = startTour;
    
    // Agregar estilos al botón
    helpButton.style.cssText = `
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2196f3, #1976d2);
        color: white;
        border: none;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(33, 150, 243, 0.3);
        z-index: 1000;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    `;
    
    // Efectos hover
    helpButton.addEventListener('mouseenter', function() {
        this.style.transform = 'scale(1.1)';
        this.style.boxShadow = '0 6px 20px rgba(33, 150, 243, 0.4)';
    });
    
    helpButton.addEventListener('mouseleave', function() {
        this.style.transform = 'scale(1)';
        this.style.boxShadow = '0 4px 15px rgba(33, 150, 243, 0.3)';
    });
    
    // Agregar al DOM
    document.body.appendChild(helpButton);
}

// Inicializar todo cuando la página esté cargada
document.addEventListener('DOMContentLoaded', function() {
    addTourStyles();
    addHelpButton();
    
    // Verificar si es la primera visita (comentar esta línea si no quieres tour automático)
    checkFirstVisit();
});
